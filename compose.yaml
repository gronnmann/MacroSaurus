services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: macrosaurus
      POSTGRES_USER: macrosaurus
      POSTGRES_PASSWORD: macrosaurus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrosaurus"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - macrosaurus-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: macrosaurus
      MINIO_ROOT_PASSWORD: macrosaurus-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - macrosaurus-minio:/data

volumes:
  macrosaurus-postgres:
  macrosaurus-minio:
