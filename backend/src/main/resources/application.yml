spring:
  application:
    name: macrosaurus
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/macrosaurus}
    username: ${DATABASE_USERNAME:macrosaurus}
    password: ${DATABASE_PASSWORD:macrosaurus}
  flyway:
    locations: classpath:db/migration
    # Spring Modulith can initialize event_publication before an existing
    # installation is first brought under Flyway management. Baseline at zero
    # so every Macrosaurus migration still runs in that upgrade scenario.
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

macrosaurus:
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    supabase-url: ${SUPABASE_URL:}
    audience: authenticated
    dev-mode: ${DEV_AUTH_ENABLED:true}
  open-food-facts:
    base-url: ${OFF_BASE_URL:https://world.openfoodfacts.org}
    user-agent: ${OFF_USER_AGENT:Macrosaurus/0.1 (contact@example.com)}
    connect-timeout: ${OFF_CONNECT_TIMEOUT:5s}
    read-timeout: ${OFF_READ_TIMEOUT:15s}
  open-router:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:google/gemini-2.5-flash}
    connect-timeout: ${OPENROUTER_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENROUTER_READ_TIMEOUT:90s}
