name: Quality and containers

on:
    pull_request:
    push:
        branches: [master]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.25.0

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 26
                  cache: maven

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run formatting and static checks
              run: pnpm quality

            - name: Run frontend tests
              run: pnpm --dir web test

            - name: Build frontend
              run: pnpm --dir web build

            - name: Validate production Compose
              run: docker compose --env-file .env.production.example -f compose.production.yml config

    publish-containers:
        if: github.event_name != 'pull_request'
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: backend
                      dockerfile: backend/Dockerfile
                    - service: web
                      dockerfile: web/Dockerfile
        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Validate web build configuration
              if: matrix.service == 'web'
              env:
                  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
                  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
              run: |
                  test -n "$VITE_SUPABASE_URL" || { echo "Set repository variable SUPABASE_URL" >&2; exit 1; }
                  test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Set repository variable SUPABASE_PUBLISHABLE_KEY" >&2; exit 1; }

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/macrosaurus-${{ matrix.service }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=sha-
                  labels: |
                      org.opencontainers.image.title=Macrosaurus ${{ matrix.service }}
                      org.opencontainers.image.description=Macrosaurus ${{ matrix.service }} production image

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  annotations: ${{ steps.metadata.outputs.annotations }}
                  build-args: |
                      VITE_AUTH_MODE=supabase
                      VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
                      VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
                  provenance: mode=max
                  sbom: true
