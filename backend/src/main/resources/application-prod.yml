macrosaurus:
  security:
    supabase-url: ${SUPABASE_URL}
    audience: authenticated
    dev-mode: false

spring:
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 4

server:
  tomcat:
    threads:
      min-spare: 2
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
